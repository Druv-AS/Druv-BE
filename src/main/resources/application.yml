server:
  port: ${PORT:8080}
  # Let in-flight requests finish when the orchestrator sends SIGTERM during a rollout.
  shutdown: graceful
  # Do not advertise the servlet container version in error pages or headers.
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:12h}
      cookie:
        name: DHRUVSESSION
        http-only: true
        # Overridden to true in the prod profile; startup fails if it is left false there.
        secure: ${SESSION_COOKIE_SECURE:false}
        # "None" is required when the SPA and API are on different registrable domains
        # (e.g. Vercel + Render). Prefer same-site subdomains and "Lax" where possible.
        same-site: ${SESSION_COOKIE_SAMESITE:Lax}

spring:
  application:
    name: dhruv-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    # Upper bound on the graceful shutdown above; must stay below the platform's SIGKILL grace.
    timeout-per-shutdown-phase: 25s
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:dhruvdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 10000
      # Recycle below typical managed-Postgres and proxy idle timeouts.
      max-lifetime: 1200000
      idle-timeout: 300000
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    open-in-view: false        # keeps lazy loading out of the view layer
    hibernate:
      # Flyway owns the schema. "update" let Hibernate silently alter production tables
      # and mask drift between the entities and the migrations.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        # Dialect is auto-detected from the JDBC connection; setting it by hand caused the
        # H2/PostgreSQL mismatch this config used to carry.

security:
  rate-limit:
    auth:
      max-attempts: ${AUTH_RATE_LIMIT_ATTEMPTS:10}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW:300}
    # Enable only behind a proxy that overwrites X-Forwarded-For, otherwise clients can
    # forge the header and bypass the limit.
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}

app:
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.dhruv: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true   # exposes /actuator/health/liveness and /readiness

---
# ------------------------------------------------------------------ dev
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: validate
logging:
  level:
    com.dhruv: DEBUG

---
# ------------------------------------------------------------------ prod
# Every value below must come from the environment. StartupConfigValidator refuses to
# start the application if the datasource, CORS origins, or cookie flags are unsafe.
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false
server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
