# Test profile: in-memory H2 with the real Flyway migrations applied, so tests exercise
# the same schema production runs against rather than a Hibernate-generated approximation.
spring:
  datasource:
    url: jdbc:h2:mem:dhruvtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  servlet:
    session:
      cookie:
        secure: false
        same-site: Lax

security:
  rate-limit:
    auth:
      # High enough that functional tests are never throttled; the limiter has its own test.
      max-attempts: 1000
      window-seconds: 60

app:
  websocket:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.dhruv: DEBUG
    org.springframework.security: INFO
