server:
  port: 8080

spring:
  application:
    name: dhruv-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:dhruvdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false

# Supabase PostgreSQL Cloud Configuration Preset:
# To connect Spring Boot directly to Supabase, launch with:
# SPRING_DATASOURCE_URL=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require
# SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
# SPRING_DATASOURCE_USERNAME=postgres.izvylqhhmllqqqszznti
# SPRING_DATASOURCE_PASSWORD=S@urabh@one
# SPRING_JPA_DIALECT=org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.dhruv: INFO
